<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Checker</title>

<style>

body{
font-family:Arial;
max-width:700px;
margin:auto;
padding:40px;
}

textarea{
width:100%;
height:220px;
}

button{
padding:12px;
width:100%;
background:black;
color:white;
border:none;
margin-top:10px;
cursor:pointer;
}

li{
margin:6px 0;
}

</style>
</head>

<body>

<h2>WhatsApp Checker 🔥</h2>

<textarea id="numbers"
placeholder="923001234567&#10;923111234567"></textarea>

<button onclick="checkNumbers()">Check Numbers</button>

<h3 id="loading"></h3>

<ul id="results"></ul>

<script>

async function checkNumbers(){

const nums = document
.getElementById("numbers")
.value
.split("\n")
.map(n=>n.trim())
.filter(Boolean);

if(nums.length === 0){
alert("Enter numbers first");
return;
}

document.getElementById("loading").innerText="Checking... ⏳";

const res = await fetch("/api/check",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({numbers:nums})
});

const data = await res.json();

document.getElementById("loading").innerText="Done ✅";

const list = document.getElementById("results");

list.innerHTML="";

data.forEach(r=>{
list.innerHTML += `<li>${r.number} → ${r.status}</li>`;
});

}

</script>

</body>
</html>
