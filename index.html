<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Number Checker</title>
<style>
body{
    font-family: Arial;
    max-width:600px;
    margin:auto;
    padding:40px;
}
textarea{
    width:100%;
    height:200px;
}
button{
    padding:10px 20px;
    margin-top:10px;
}
</style>
</head>
<body>

<h2>WhatsApp Checker 🔥</h2>

<textarea id="numbers" placeholder="923001234567&#10;923111234567"></textarea>

<br>

<button onclick="check()">Check Numbers</button>

<ul id="results"></ul>

<script>
async function check(){

    const nums = document
        .getElementById("numbers")
        .value
        .split("\n")
        .map(n => n.trim())
        .filter(Boolean);

    const res = await fetch("/api/check",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({numbers:nums})
    });

    const data = await res.json();

    const list = document.getElementById("results");
    list.innerHTML="";

    data.forEach(r=>{
        list.innerHTML += `<li>${r.number} → ${r.status}</li>`;
    });
}
</script>

</body>
</html>
